name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2026-04-07

defaults:
  run:
    shell: bash

jobs:
  # krio-fiber's asm context switch is per-(arch, ABI), and its correctness
  # properties are arch-ASYMMETRIC — a test can pass vacuously on one arch
  # while the bug it guards against is live on another. The clearest case:
  # x86_64 SysV has no callee-saved FP registers at all, so the d8-d15
  # regression test compiles into caller-saved xmm slots there and passes
  # no matter what the switch does. It is only meaningful on aarch64
  # (d8-d15) and MS x64 (xmm6-xmm15). Hence:
  #
  #   * an aarch64 row on both Linux and macOS — aarch64 is the arch
  #     krio's main consumer actually ships on, and it previously had
  #     zero CI coverage;
  #   * a `profile` axis — register allocation and spill decisions differ
  #     substantially at opt-level 3, and a switch bug that debug-mode
  #     stack traffic papers over can surface only in release.
  #
  # `macos-latest` is arm64 (has been since macos-14), which is why the
  # x86_64 macOS row has to name `macos-15-intel` explicitly.
  test:
    name: ${{ matrix.platform.name }} (${{ matrix.profile }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
        platform:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --target "${{ matrix.platform.target }}"
          rustup default "$RUST_TOOLCHAIN"

      - name: Show toolchain
        run: rustc -vV

      # Lints are profile-independent; run them once per platform.
      - name: Check formatting
        if: matrix.profile == 'debug'
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: matrix.profile == 'debug'
        run: cargo clippy --workspace --all-targets --target "${{ matrix.platform.target }}" -- -D warnings

      - name: Run tests
        run: |
          flags=""
          if [ "${{ matrix.profile }}" = "release" ]; then flags="--release"; fi
          cargo test --workspace --target "${{ matrix.platform.target }}" $flags

  # krio-fiber must still *compile* on targets it does not implement a
  # context switch for — it gets pulled in transitively by consumers that
  # drive concurrency through the stackless krio-async path. Two classes
  # matter enough to gate on:
  #
  #   * wasm32 — no addressable switchable stack exists, permanently the
  #     panic-stub path;
  #   * aarch64-pc-windows-msvc — an unqualified `cfg(target_arch =
  #     "aarch64")` used to emit the AAPCS64 switch there with no TEB
  #     handling, producing a build that switched correctly and then
  #     died on the first panic crossing a fiber boundary. Adding the
  #     TEB swap was tried on a windows-11-arm runner and is *still* not
  #     enough — release dies with 0xe06d7363 on the panicking tests
  #     while debug passes (see arch.rs). It remains an explicit panic
  #     stub; this job keeps it from regressing into a switch that
  #     merely compiles.
  cross-check:
    name: Cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-pc-windows-msvc
          - wasm32-unknown-unknown
          # atomics/bulk-memory on by default, so this is the row that
          # type-checks krio-wasm's shared-memory parking path. The
          # bare wasm32-unknown-unknown row above deliberately does not
          # have atomics, and covers the other half: that the crate
          # still builds when the instructions are unavailable.
          - wasm32-wasip1-threads
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"
          rustup default "$RUST_TOOLCHAIN"

      # `check --all-targets`, deliberately, on both counts.
      #
      # --all-targets, not just the lib: the panic-stub path is easy to
      # keep compiling while a test or bench that assumes a real context
      # switch quietly breaks. `tests/abi.rs` did exactly that — an
      # ungated `sp_now()` that only assigns its output under x86_64 or
      # aarch64, so every other target failed to build the test binary
      # while `cargo build` stayed green.
      #
      # `check` rather than `build`, because --all-targets adds test
      # *binaries*, and linking one for aarch64-pc-windows-msvc needs
      # link.exe, which an ubuntu runner does not have. The lib-only
      # build got away with it by never linking. Checking still catches
      # the whole class of error this job exists for — the sp_now break
      # was E0381, found long before the linker — and the shared-memory
      # job below does link and run for real.
      - name: Check krio-fiber
        run: cargo check -p krio-fiber --all-targets --target "${{ matrix.target }}"

      # The portable half of the family has to keep working on wasm, and
      # krio-parallel is the crate that will grow a shared-memory
      # backend, so it is worth gating now rather than after it drifts.
      - name: Check portable crates
        run: |
          cargo check --all-targets --target "${{ matrix.target }}" \
            -p krio-core -p krio-runtime -p krio-stackless \
            -p krio-async -p krio-parallel -p krio-wasm

  # Architectures with no hosted runner. The context switch is
  # per-(arch, ABI) assembly, and compiling it proves almost nothing — a
  # switch that assembles and then drops a callee-saved register is
  # exactly the failure this project has shipped before. So these run
  # the real suite.
  #
  # aarch64 is absent on purpose: it has native rows in the matrix above,
  # for both Linux and macOS.
  #
  # `gcc-<arch>-linux-gnu` is the compiler only — it carries no target
  # libc, so without the matching `libc6-dev-*` the link dies on a
  # missing Scrt1.o. That is what broke this job on its first run.
  arch:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # No emulator: 32-bit ELF runs natively on an x86_64 kernel,
          # and rustc drives `cc -m32` for this target, so multilib is
          # the whole requirement.
          - name: i686 (x86-32 SysV, native)
            target: i686-unknown-linux-gnu
            packages: gcc-multilib
            linker: ""
            runner: ""
          - name: riscv64 (RV64GC, qemu)
            target: riscv64gc-unknown-linux-gnu
            packages: gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user
            linker: riscv64-linux-gnu-gcc
            runner: qemu-riscv64 -L /usr/riscv64-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"
          rustup default "$RUST_TOOLCHAIN"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      # Note what is deliberately *not* set here: no
      # CARGO_TARGET_<TRIPLE>_RUSTFLAGS. That key replaces
      # `build.rustflags` rather than merging with it, so setting it
      # would silently drop `-Cforce-frame-pointers=yes` from
      # .cargo/config.toml — and `Fiber::saved_fp` then returns null,
      # failing the GC-introspection tests for a reason that has nothing
      # to do with the switch. Learned the hard way bringing these up.
      #
      # Both profiles, for the same reason the native matrix runs both:
      # register allocation differs at opt-level 3, and a switch bug that
      # debug-mode stack traffic hides can surface only in release.
      - name: Run tests
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: |
          triple=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          if [ -n "${{ matrix.linker }}" ]; then
            export "CARGO_TARGET_${triple}_LINKER=${{ matrix.linker }}"
          fi
          if [ -n "${{ matrix.runner }}" ]; then
            export "CARGO_TARGET_${triple}_RUNNER=${{ matrix.runner }}"
          fi
          cargo test --workspace
          cargo test --workspace --release

  # Compiling the atomics path is not the same as it working. This job
  # executes the cluster on a real engine with a real shared memory:
  # several agents over one linear memory, parking on
  # `memory.atomic.wait32` and woken by `memory.atomic.notify`.
  #
  # wasm32-wasip1-threads stands in for a browser because it has the
  # same shape — one instance per agent over one shared memory — and
  # needs no headless browser to drive. It is a probe, not a production
  # target: threads were removed from WASI Preview 2, which is exactly
  # why krio-wasm makes agent creation a host hook instead of a WASI
  # import. When this engine goes away the harness is what changes.
  shared-memory:
    name: Shared-memory wasm (wasmtime)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-wasip1-threads
          rustup default "$RUST_TOOLCHAIN"

      # Pinned, and the pin has an expiry date on it. wasmtime 47 removed
      # `-S threads`, its wasi-threads support, so the latest release
      # cannot run this job at all: without that flag there is no
      # wasi-threads host and the module fails on `unknown import:
      # env::memory`. v46.0.0 is the last one that has it.
      #
      # This is the withdrawal the design anticipated — threads were
      # removed from WASI Preview 2 and the engines are following — and
      # it is why agent creation is a host hook rather than a WASI
      # import: when this engine goes, only the harness changes. When
      # v46 becomes untenable, repoint this job at whatever runs
      # shared-memory wasm next rather than trying to keep it alive.
      - name: Install wasmtime
        run: |
          curl -sSf https://wasmtime.dev/install.sh | bash -s -- --version v46.0.0
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          "$HOME/.wasmtime/bin/wasmtime" --version

      - name: Run the cluster on shared memory
        env:
          CARGO_TARGET_WASM32_WASIP1_THREADS_RUNNER: wasmtime -W threads=y -W shared-memory=y -S threads=y
        run: |
          cargo test -p krio-parallel -p krio-wasm --target wasm32-wasip1-threads

      # krio-fiber's own suites (abi, basic) build a real Fiber, so they
      # are native-only by nature and are expected to panic here — the
      # cross-compile job already checks they still *compile*. This is
      # the part of krio-fiber that does mean something on wasm: yield
      # points routing to a host suspender, and Fiber still refusing to
      # pretend it exists.
      - name: Run the host-suspension path
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: |
          rustup target add wasm32-wasip1
          cargo test -p krio-fiber --target wasm32-wasip1 --test host_suspend

  # The main-thread rule — `memory.atomic.wait32` throws on a browser's
  # main thread, so `drive_once` must never park — is guarded portably by
  # krio-parallel's PoisonPark test, which fails in microseconds on any
  # target if someone adds a park to that path. This job checks the other
  # half, which no unit test can: that the whole shared-memory build
  # recipe actually instantiates and runs in a real engine — atomics,
  # -Zbuild-std, cross-origin isolation, TLS setup and all.
  #
  # It is the expensive job in this file (a from-source wasm-bindgen-cli
  # and a headless browser), so it is deliberately the last line of
  # defence rather than the first.
  browser:
    name: Browser main-thread (Chrome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component rust-src --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"

      # The CLI and the crate must be the same version — wasm-bindgen's
      # schema is checked exactly — so take the version from the lockfile
      # rather than pinning one here that drifts.
      - name: Install wasm-bindgen-cli matching the lockfile
        run: |
          version=$(cargo metadata --format-version 1 --filter-platform wasm32-unknown-unknown \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version' | head -1)
          echo "wasm-bindgen $version"
          cargo install wasm-bindgen-cli --version "$version"

      - name: Run the main-agent tests in Chrome
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          RUSTFLAGS: -Ctarget-feature=+atomics,+bulk-memory,+mutable-globals
        run: |
          # The runner image ships Chrome and a matching ChromeDriver.
          export CHROMEDRIVER="$(command -v chromedriver)"
          cargo test -p krio-wasm --target wasm32-unknown-unknown \
            -Zbuild-std=std,panic_abort --test browser
